name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          make install
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Test
        run: make test

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: flux
          POSTGRES_DB: flux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FLUX_DATABASE_URL: postgresql+asyncpg://flux:flux@localhost:5432/flux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          make install
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Verify reversibility (downgrade then re-upgrade)
        run: |
          alembic downgrade base
          alembic upgrade head

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flux-control-plane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
