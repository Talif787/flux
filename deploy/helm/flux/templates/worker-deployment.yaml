{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flux.fullname" . }}-worker
  labels:
    {{- include "flux.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "flux.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "flux.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "flux.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "flux.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
            - flux.worker.app:app
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.worker.service.targetPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.service.targetPort }}
              protocol: TCP
          env:
            - name: FLUX_WORKER_NAME
              value: {{ .Values.worker.config.workerName | quote }}
            - name: FLUX_WORKER_SERVED_MODELS
              value: {{ .Values.worker.config.servedModels | quote }}
            - name: FLUX_WORKER_MAX_TOKENS_CAP
              value: {{ .Values.worker.config.maxTokensCap | quote }}
            {{- if .Values.worker.selfRegister.enabled }}
            - name: FLUX_WORKER_CONTROL_PLANE_URL
              value: {{ .Values.worker.selfRegister.controlPlaneUrl | quote }}
            - name: FLUX_WORKER_ADVERTISE_URL
              value: {{ .Values.worker.selfRegister.advertiseUrl | quote }}
            - name: FLUX_WORKER_API_KEY
              value: {{ .Values.worker.selfRegister.apiKey | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
