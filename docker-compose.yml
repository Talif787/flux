services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - flux_pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLUX_ENV: local
      FLUX_DATABASE_URL: postgresql+asyncpg://flux:flux@db:5432/flux
      FLUX_API_KEY_PEPPER: local-dev-pepper
      FLUX_LOG_JSON: "true"
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn flux.api.app:app --host 0.0.0.0 --port 8000"

volumes:
  flux_pgdata:
